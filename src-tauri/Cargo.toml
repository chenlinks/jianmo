[package]
name = "jianmo"
version = "0.2.0"
description = "Jianmo Markdown editor"
license = "Apache-2.0"
edition = "2021"

[lib]
name = "jianmo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
